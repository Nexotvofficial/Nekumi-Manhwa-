<!DOCTYPE html>
<html lang="es">
<head>
<script src="site-guard.js?v=9"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos — Nekumi</title>
<link rel="canonical" href="https://nekutoon.com/favorites.html">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<header class="nav">
  <div class="wrap nav-row">
    <a href="/" class="brand">NEKU<span>MI</span></a>
    <nav class="nav-links">
      <a href="/#novedades">Novedades</a>
      <a href="/#catalogo">Catálogo</a>
      <a href="favorites.html" class="current">Favoritos</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" type="button">☰</button>
  </div>
  <div class="nav-mobile">
    <a href="/#novedades">Novedades</a>
    <a href="/#catalogo">Catálogo</a>
    <a href="favorites.html">Favoritos</a>
  </div>
</header>

<main class="wrap section">
  <div class="section-head">
    <h2>Tus favoritos</h2>
    <span class="count" id="favCount"></span>
  </div>
  <div class="grid" id="favGrid"></div>
  <p class="empty-state" id="favEmpty" hidden>Todavía no marcaste ningún título con ♡. Los favoritos se guardan en este navegador.</p>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span>Nekumi · catálogo generado automáticamente desde el repositorio.</span>
    <nav class="footer-links">
      <a href="dmca.html">DMCA</a>
      <a href="privacy.html">Privacidad</a>
      <a href="terms.html">Términos</a>
    </nav>
  </div>
</footer>

<script src="data.js?v=9"></script>
<script src="app.js?v=9" defer></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics-compat.js"></script>
<script src="auth.js?v=9"></script>
<script>
  window.addEventListener('load', async () => {
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.querySelector('.nav').classList.toggle('menu-open');
    });
    let catalog = [];
    try { catalog = await fetchCatalog(); } catch { catalog = []; }
    const favs = readFavorites();
    const items = catalog.filter((m) => favs.includes(m.id));
    document.getElementById('favCount').textContent = `${items.length} títulos`;
    document.getElementById('favEmpty').hidden = items.length !== 0;
    document.getElementById('favGrid').innerHTML = items.map(cardHTML).join('');
    bindFavButtons(document.getElementById('favGrid'));
    document.getElementById('favGrid').addEventListener('click', (e) => {
      if (e.target.closest('.fav-toggle')) {
        setTimeout(() => {
          const stillFav = readFavorites();
          document.getElementById('favGrid').innerHTML = items
            .filter((m) => stillFav.includes(m.id))
            .map(cardHTML).join('');
          bindFavButtons(document.getElementById('favGrid'));
        }, 0);
      }
    });
  });
</script>
</body>
</html>
