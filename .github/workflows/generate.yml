name: Generate Manga Catalog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mangas.json'
      - 'uploaded_cache.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Run Generator Script
        run: python generator.py

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Actualizar repositorio remoto para evitar conflictos antes de empujar
          git pull --rebase origin main
          
          if [ -d "catalog" ]; then git add catalog/; fi
          if [ -d "img" ]; then git add img/; fi
          if [ -f "mangas.json" ]; then git add mangas.json; fi
          if [ -f "uploaded_cache.json" ]; then git add uploaded_cache.json; fi
          
          if git diff --staged --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "auto: optimización webp y actualización de catálogo [skip ci]"
            git push origin main
          fi
