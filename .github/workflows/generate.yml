name: Generate Manga Catalog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mangas.json'
      - 'uploaded_cache.json'
      - 'README.md'
  workflow_dispatch:

# 🚀 Evitar colisiones: Cancela ejecuciones en curso si haces varios push seguidos
concurrency:
  group: "manga-catalog-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: ⚙️ Run Generator Script
        run: python generator.py

      - name: 💾 Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "✅ No hay cambios para guardar."
          else
            echo "🚀 Cambios detectados. Creando commit..."
            git commit -m "auto: optimización webp y actualización de catálogo 📚 [skip ci]"
            
            git pull --rebase origin main
            git push origin main
          fi

      - name: ⚡ Purgar Caché CDN (Tiempo Real)
        run: |
          echo "🧹 Forzando la purga inmediata de la caché en los servidores de jsDelivr..."
          curl -s "https://purge.jsdelivr.net/gh/Nexotvofficial/Nekumi-Manhwa-@main/mangas.json"
          echo "✅ Caché eliminada. Los cambios ya están disponibles en tiempo real globalmente."
