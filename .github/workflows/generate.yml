name: Generate Manga Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'generator.py'
  workflow_dispatch:

# Permiso explícito de escritura para resolver el error 403
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Run Generator Script
        run: python generator.py

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mangas.json catalog/
          
          # Verificar si hay cambios antes de hacer commit
          if git diff --staged --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "auto: actualización de catálogo y conversión a webp"
            git push origin main
          fi
